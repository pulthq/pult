name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # what a typo costs at a user's, before the suites (review 2026-10-27, Т10); tools/ci_local.sh does the same here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5, by commit: a tag can move
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: "3.12"
      - name: Lint tools
        run: python -m pip install ruff==0.17.3 shellcheck-py==0.11.0.1
      - name: Names that don't exist, imports and values nobody uses (ruff)
        run: ruff check .
      - name: Shell scripts (shellcheck)
        if: success() || failure()
        run: shellcheck install.sh deploy/relay/install.sh src/pult-tab.sh tools/ci_local.sh
      - name: Version, changelog, tag and requirements agree
        if: success() || failure()
        run: python tools/consistency.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"          # as Pult runs: the daemon and the pult command use -X utf8 on Windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5, by commit: a tag can move
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements.txt -r relay/requirements.txt
      - name: Daemon, hook, tab wrapper, rendering, both languages
        run: python tests/test_pult.py
      - name: Install, setup wizard, report, uninstall
        if: success() || failure()          # every check runs, whatever failed before
        run: python tests/test_setup.py
      - name: Web app data and the phone → relay → computer chain
        if: success() || failure()          # every check runs, whatever failed before
        run: python tests/test_web.py
      - name: Relay
        if: success() || failure()          # every check runs, whatever failed before
        run: python tests/test_relay.py
      - name: Shell scripts parse
        if: (success() || failure()) && runner.os != 'Windows'
        run: bash -n install.sh && bash -n deploy/relay/install.sh && sh -n src/pult-tab.sh
      - name: install.ps1 parses
        if: success() || failure()          # every check runs, whatever failed before
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }
      - name: Install, start, remove — for real (Windows)
        if: (success() || failure()) && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "install.ps1: $LASTEXITCODE" }
          if ($out -notmatch 'Installing dependencies') { throw "install.ps1 should speak the system's language (English here)" }
          $pult = "$HOME\.local\share\pult"
          $cmd = "$HOME\.local\bin\pult.cmd"
          foreach ($f in 'venv\Scripts\pythonw.exe', 'pult-tab.exe', 'Pult.task.xml', 'pultd.py') {
            if (-not (Test-Path "$pult\$f")) { throw "missing: $f" }
          }
          & $cmd status
          if ($LASTEXITCODE -ne 0) { throw "pult status: $LASTEXITCODE" }
          # the installed wrapper: a run that isn't a tab chat goes straight to the program, output and all
          $tab = & "$pult\pult-tab.exe" "$env:ComSpec" /c echo pult-tab-ok | Out-String
          if ($tab -notmatch 'pult-tab-ok') { "[$tab]"; throw "pult-tab.exe didn't pass the program through" }
          # the user's PATH has ~\.local\bin now
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains "$HOME\.local\bin")) { throw "PATH" }
          # Task Scheduler takes the task definition as written
          schtasks /Create /TN PultCI /XML "$pult\Pult.task.xml" /F
          if ($LASTEXITCODE -ne 0) { throw "schtasks /Create: $LASTEXITCODE" }
          schtasks /Query /TN PultCI /XML | Out-Null
          schtasks /Delete /TN PultCI /F
          # the daemon under pythonw writes its own log (no settings: it says so and stops)
          Start-Process -Wait -FilePath "$pult\venv\Scripts\pythonw.exe" -ArgumentList '-X', 'utf8', "`"$pult\pultd.py`""
          $log = Get-Content -Raw "$HOME\.local\state\pult\pult.log"
          if ($log -notmatch 'no PULT_BOT_TOKEN') { $log; throw "no daemon log" }
          "y`ny" | & $cmd uninstall
          if ($LASTEXITCODE -ne 0) { throw "pult uninstall: $LASTEXITCODE" }
          if (Test-Path $cmd) { throw "pult.cmd is still there" }
          if (Test-Path "$pult\Pult.task.xml") { throw "the task definition is still there" }
