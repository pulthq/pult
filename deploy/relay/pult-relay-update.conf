# Pult relay with the updater (install.sh --auto puts this into /etc/systemd/system/pult-relay.service.d/update.conf):
# the relay leaves the release the computer runs in /var/lib/pult-relay/want.json and passes the updater's report on
[Service]
Environment=PULT_RELAY_STATE=/var/lib/pult-relay
Environment=PULT_RELAY_UPDATER=/var/lib/pult-relay-update/status.json
