# Pult web app on nginx: /pult/ on your domain, proxied to the relay on 127.0.0.1:8097.
# Put this file into /etc/nginx/snippets/ and include it inside the HTTPS server block of your domain:
#     include /etc/nginx/snippets/pult.conf;
# and add this line once to the http {} block (for example /etc/nginx/conf.d/pult-ratelimit.conf):
#     limit_req_zone $binary_remote_addr zone=pult:1m rate=10r/s;
# Access is decided by the relay (Telegram's signature, your Telegram ID) and by the Mac (the bot token);
# here — proxying, a rate limit and headers. The Mini App opens inside Telegram, hence frame-ancestors.

# WebSockets: the phone (/pult/ws) and the Mac (/pult/agent); long-lived, the relay pings every 25 s
location ~ ^/pult/(ws|agent)$ {
    limit_req zone=pult burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /pult/ {
    limit_req zone=pult burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
}
